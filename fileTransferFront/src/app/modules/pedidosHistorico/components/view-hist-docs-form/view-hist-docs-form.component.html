<m-modal-docs-hist [opener$]="modalOpener$" icon="assets/images/icons/big-users.png" 
  [header]="viewValidCMRheaderText" 
  [pedidoSelected]="pedidoSelected" 
  [isUserExter]="isExternoUser"
  [isUserConsulta]="isConsultaUser"
  [isNotFACdoc]="noFac2show"
  [canBeClosed]="!isLoading"
  [noHaveFiles]="fileNotFound"
  (downloadedCMR)="downloadCMR()" 
  (downloadedFAC)="downloadFAC()"
  (anotated)="anotaCMRselected()"
  (canceled)="onCancel()">
  
  <!--CMR-->
  <div cmr [class.is-rejected]="pedidoSelected.hasCMR===3" class="document-container">
    <div *ngIf="isImgFile">
      <img id="imgValidDocDiv" [src]="cmrPath" alt="image" class="view-hist-docs-form__imgJPG">
    </div>
    <div *ngIf="isPdfFile" id="pdfValidDocDiv" class="view-hist-docs-form__pdfDiv">
      <iframe #myIframe id="pdfValidIframe" src="" width="100%" height="100%" [frameBorder]="0"></iframe>
    </div>
    <div *ngIf="isTifFile">
      <img id="tifValidDocDiv" [src]="cmrPath" alt="image" class="view-hist-docs-form__imgTIF">
    </div>
  </div>

  <!--FAC-->
  <div fac [class.is-rejected]="pedidoSelected.hasFAC===3" class="document-container">
    <ng-container *ngIf="!noFac2show; else noFacMessage">
      <!-- Solo puede ser PDF-->
      <div *ngIf="isPdfFileFAC" id="pdfValidDocDivFAC" class="view-hist-docs-form__pdfDiv">
        <iframe #myIframeFAC id="pdfValidIframeFAC" src="" width="100%" height="100%" [frameBorder]="0"></iframe>
      </div>
    </ng-container>

    <!-- Template para cuando no hay factura -->
    <ng-template #noFacMessage>
      <div class="view-hist-docs-form__noFac2showMessage">
        <p>{{ 'PEDIDOS_HIST.FORM.MESSAGES.NO_FAC_AVAILABLE' | translate }}</p>
      </div>
    </ng-template>
  </div>

</m-modal-docs-hist>

<m-anota-hist-cmr-form id="anotaModalB" [opener$]="anotaModalOpener$" [header]="anotaTitle" [pedidoSelected]="pedidoSelected" [directANOT]="false" (cancel)="onCancel()">
</m-anota-hist-cmr-form>
